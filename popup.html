<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Workbench</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Chat Workbench</h1>
      <div class="settings">
        <label class="setting" for="anchorsEnabled">
          <span class="setting-copy">
            <span class="setting-name">Chat anchors</span>
            <span class="setting-description" id="anchors-description">Preview and jump between turns.</span>
          </span>
          <input type="checkbox" id="anchorsEnabled" aria-label="Chat anchors" aria-describedby="anchors-description" disabled />
        </label>
        <label class="setting" for="anchorSide">
          <span class="setting-copy setting-name">Rail side</span>
          <select id="anchorSide" disabled>
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </label>
        <label class="setting" for="counterEnabled">
          <span class="setting-copy">
            <span class="setting-name">Token counter</span>
            <span class="setting-description" id="counter-description">Count conversation and draft tokens locally.</span>
          </span>
          <input type="checkbox" id="counterEnabled" aria-label="Token counter" aria-describedby="counter-description" disabled />
        </label>
      </div>
      <p class="status" id="settings-status" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
